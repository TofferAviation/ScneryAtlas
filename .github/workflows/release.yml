name: Publish Windows release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $projectVersion = ([xml](Get-Content app/SceneryAtlas.App.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version" -or $projectVersion -ne $version) {
            throw "The pushed tag, package.json and .NET version must match."
          }
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        shell: pwsh
        run: |
          npm run build:web
          if ($LASTEXITCODE -ne 0) { throw 'Browser build failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Install NSIS 3.13
        shell: pwsh
        run: |
          choco install nsis --version=3.13.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'NSIS compiler not found.' }
          "NSIS_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package and verify installer
        shell: pwsh
        run: |
          $env:NuGetAudit = 'false'
          pwsh -NoProfile -File scripts/package.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Desktop publish failed.' }
          pwsh -NoProfile -File scripts/build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $manifest = Get-Content artifacts/releases/latest.json -Raw | ConvertFrom-Json
          $installer = Join-Path 'artifacts/releases' $manifest.installer
          if ($manifest.version -ne $version -or !(Test-Path -LiteralPath $installer)) { throw 'Release manifest does not match this build.' }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $manifest.sha256) { throw 'Installer checksum failed.' }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create "v$version" "artifacts/releases/SceneryAtlas-$version-Setup.exe" "artifacts/releases/SceneryAtlas-$version-Setup.exe.sha256" "artifacts/releases/latest.json" --verify-tag --latest --generate-notes --title "Scenery Atlas $version"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
